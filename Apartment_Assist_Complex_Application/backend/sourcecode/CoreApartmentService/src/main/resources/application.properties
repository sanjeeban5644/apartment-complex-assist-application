spring.application.name=CoreApartmentService
server.port=7001


#spring.datasource.url=jdbc:postgresql://localhost:5432/apartment_complex_db
#spring.datasource.url=jdbc:postgresql://localhost:5434/apartment_complex_db
spring.datasource.url=jdbc:postgresql://localhost:5434/apartment_complex_db?TimeZone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postSql@5644
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgres
#spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


spring.flyway.enabled=true
spring.flyway.schemas=apt_core
spring.flyway.default-schema=apt_core
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


# Kafka
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Topic name
app.kafka.topic.register=register-user