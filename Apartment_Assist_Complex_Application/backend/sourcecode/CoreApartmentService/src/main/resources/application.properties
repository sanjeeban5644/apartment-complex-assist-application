spring.application.name=CoreApartmentService
server.port=7001


spring.datasource.url=jdbc:postgresql://localhost:5432/apartment_complex_db
spring.datasource.username=postgres
spring.datasource.password=postSql@5644
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgres
#spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#spring.jpa.defer-datasource-initialization=true



spring.flyway.enabled=true
spring.flyway.schemas=apt_core
spring.flyway.default-schema=apt_core
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true